[project]
name = "jakemore"
version = "0.1.0"
description = "A clean, minimal JAX implementation of Andrej Karpathy's makemore (Part 1)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "chex>=0.1.90",
    "grain>=0.2.13",
    "jax>=0.4.0",
    "matplotlib>=3.10.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

